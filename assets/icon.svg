<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 双网卡分流 应用图标：无线网卡（后卡·右上）+ 有线网卡（前卡·左下） -->
  <title>双网卡分流</title>
  <defs>
    <!-- 背景渐变：蓝 → 青，呼应「有线 + 无线」双通道 -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8DFD"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- 应用底板（圆角方形） -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ===== 无线网卡（后卡，右上） ===== -->
  <g transform="translate(322 178) rotate(8)">
    <!-- 软阴影：故意不用 filter，保证任意 SVG 转换器兼容 -->
    <rect x="-114" y="-80" width="244" height="184" rx="36" fill="#0A2A66" opacity="0.25"/>
    <rect x="-122" y="-92" width="244" height="184" rx="36" fill="#EAF2FF"/>
    <!-- Wi-Fi 符号：圆点 + 三层弧 -->
    <g transform="translate(0 8)" fill="none" stroke="#0E7490" stroke-width="16" stroke-linecap="round">
      <path d="M -20.8 -12 A 24 24 0 0 1 20.8 -12"/>
      <path d="M -41.6 -24 A 48 48 0 0 1 41.6 -24"/>
      <path d="M -62.4 -36 A 72 72 0 0 1 62.4 -36"/>
      <circle cx="0" cy="10" r="14" fill="#0E7490" stroke="none"/>
    </g>
  </g>

  <!-- ===== 有线网卡（前卡，左下） ===== -->
  <g transform="translate(194 332) rotate(-8)">
    <rect x="-114" y="-80" width="244" height="184" rx="36" fill="#0A2A66" opacity="0.25"/>
    <rect x="-122" y="-92" width="244" height="184" rx="36" fill="#FFFFFF"/>
    <!-- RJ45 以太网符号：横条 + 四根引脚 -->
    <g transform="translate(0 -4)" fill="#1D4ED8">
      <rect x="-54" y="-26" width="18" height="48" rx="6"/>
      <rect x="-24" y="-26" width="18" height="48" rx="6"/>
      <rect x="6"   y="-26" width="18" height="48" rx="6"/>
      <rect x="36"  y="-26" width="18" height="48" rx="6"/>
      <rect x="-66" y="22" width="132" height="28" rx="9"/>
    </g>
  </g>
</svg>
