; zh-CN.ini —— 简体中文消息目录（默认文案来源）。
; 格式：[msgid] 分节，<msgno> = 文本模板（&1..&9 占位）。
;   [消息类 msgid]  分节，按模块划分（DNSTA/DNRSK/DNWIZ/DNREC/DNDIF/DNIPC/DNRPT/DNCMN …）
;   <消息号 msgno> = 文本模板；占位符 &1..&9，运行时用 msgv1..n 填充。
; 例：
;   [DNREC]
;   1 = 对账完成：删默认路由 &1 条、删遗留前缀 &2 条、加内网前缀 &3 条、固定 metric &4 项
; 本文件随 lang/ 目录分发；缺失条目沿「当前语言 → en → 内嵌 SC → 消息代码原文」兜底。

