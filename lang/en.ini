; en.ini —— English message catalog.
; Format: one [msgid] section per module; <msgno> = text template (&1..&9 placeholders).
;   [msgid section]  one section per module (DNSTA/DNRSK/DNWIZ/DNREC/DNDIF/DNIPC/DNRPT/DNCMN ...)
;   <msgno> = text template; placeholders &1..&9 filled with msgv1..n at render time.
; Shipped with the lang/ directory; missing keys fall back along
; "current language -> en -> embedded SC -> raw message code".

