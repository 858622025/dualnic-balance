; ja.ini —— 日本語メッセージカタログ。
; 書式：[msgid] セクション分け、<msgno> = テキストテンプレート（&1..&9 プレースホルダ）。
; キーが欠落している場合は「現在の言語 → en → 組み込み SC → メッセージコード表記」へフォールバック。

